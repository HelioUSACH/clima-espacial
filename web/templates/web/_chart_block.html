{% load i18n %}
{{ fields|json_script:fields_id }}
<div class="swx-chart-block">
  <div class="swx-chart-block__head">
    <h3><a href="{% url 'web:product_detail' product.id %}">{{ title }}</a></h3>
    <span class="status-badge">
      <span class="status-badge__dot" style="background:{{ status.color }}"></span>
      {{ status.label }}
    </span>
  </div>
  <div
    class="swx-chart"
    data-product="{{ product.id }}"
    data-range="1d"
    data-endpoint="{% url 'web:product_series_json' product.id %}"
    data-fields-id="{{ fields_id }}"
    data-no-data-message="{% trans 'Sin datos todavía.' %}"
    data-error-message="{% trans 'No se pudo cargar la serie.' %}"
  >{% trans "Cargando…" %}</div>
</div>
