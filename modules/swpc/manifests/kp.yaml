id: noaa.kp
version: 1
kind: index
title: {es: "Índice planetario Kp", en: "Planetary Kp index"}
maturity: operational
cadence: 15m
stale_after: 6h
producer: {type: collector, unit: "swx-collect@noaa.kp.timer"}
source:
  provider: "NOAA SWPC"
  inputs: ["products/noaa-planetary-k-index.json"]
  license: "Public domain (NOAA)"
  links:
    - {name: "NOAA SWPC", url: "https://www.spaceweather.gov/products/planetary-k-index"}
