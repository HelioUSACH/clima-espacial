id: noaa.goes.protons
version: 1
kind: timeseries
title: {es: "Flujo de protones (GOES)", en: "Proton flux (GOES)"}
maturity: operational
cadence: 5m
stale_after: 15m
producer: {type: collector, unit: "swx-collect@noaa.goes.protons.timer"}
source:
  provider: "NOAA SWPC"
  inputs: ["json/goes/primary/integral-protons-1-day.json"]
  license: "Public domain (NOAA)"
  links:
    - {name: "NOAA SWPC", url: "https://www.spaceweather.gov/products/goes-proton-flux"}
parameters:
  - {name: flux, units: "1/(cm2 s sr)"}
  - {name: energy, enum: [">=1 MeV", ">=5 MeV", ">=10 MeV", ">=30 MeV", ">=50 MeV", ">=60 MeV", ">=100 MeV", ">=500 MeV"]}
  - {name: satellite, units: "1"}
exchange: {hapi: true, feed: false}
description:
  es: "Flujo integral de protones energéticos medido por los satélites GOES en varios umbrales de energía. El umbral ≥10 MeV sobre 10 pfu define un evento de radiación solar (escala S de la NOAA), relevante para la radiación en vuelos polares y la salud de los satélites."
  en: "Integral energetic-proton flux measured by the GOES satellites across several energy thresholds. The ≥10 MeV threshold above 10 pfu defines a solar radiation event (NOAA's S scale), relevant to radiation on polar flights and satellite health."
facts:
  source: {es: "NOAA SWPC, GOES", en: "NOAA SWPC, GOES"}
  spacecraft: {es: "El satélite GOES primario vigente", en: "Whichever GOES satellite is currently primary"}
  cadence: {es: "5 minutos", en: "5 minutes"}
  license: {es: "Dominio público (NOAA)", en: "Public domain (NOAA)"}
  used_by: {es: "Escala S y franja de estado del portal", en: "The portal's S scale and status strip"}
