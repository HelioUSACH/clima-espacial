# Clima Espacial USACH: sub-path on the existing `helio` vhost (D-005 — no new
# subdomain, no new server{} block). Install as
# /etc/nginx/snippets/clima-espacial.conf and add one line
#     include snippets/clima-espacial.conf;
# inside the *existing* server{} block for helio.fisica.usach.cl that already
# terminates TLS (the one certbot manages) — leave the group site's own
# `location /` untouched; this snippet only adds the /clima-espacial/ paths.

upstream clima_espacial_app {
    server 127.0.0.1:8100;
}

location /clima-espacial/static/ {
    alias /var/www/clima-espacial/static/;
    expires 1h;
    add_header X-Content-Type-Options "nosniff" always;
}

location /clima-espacial/ {
    # The trailing "/" on proxy_pass's target strips the "/clima-espacial"
    # prefix before forwarding (nginx replaces the matched location prefix
    # with proxy_pass's own path): Django's urlpatterns are written without
    # the prefix and FORCE_SCRIPT_NAME=/clima-espacial adds it back only for
    # *generated* URLs (reverse()/static). Drop the slash here and every
    # internal link silently 404s.
    proxy_pass http://clima_espacial_app/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 60s;
}
