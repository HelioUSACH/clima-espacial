# Clima Espacial USACH: sub-path on the existing `helio` vhost (D-005 — no new
# subdomain, no new server{} block). Install as
# /etc/nginx/snippets/clima-espacial.conf and add one line
#     include snippets/clima-espacial.conf;
# inside the *existing* server{} block for helio.fisica.usach.cl that already
# terminates TLS (the one certbot manages) — leave the group site's own
# `location /` untouched; this snippet only adds the /clima-espacial/ paths.
#
# No `upstream {}` block here on purpose (D-051): that directive is only
# valid at the http{} context, and this file is `include`d *inside* an
# existing server{} block, so an upstream here fails `nginx -t` with
# "upstream directive is not allowed here" — verified with a dockerized
# nginx against this exact file before and after the fix.

# Compression (D-055). These directives sit in the including server{}
# context, so they also apply to the group site's own responses on this
# vhost — harmless (the group site's HTML was already gzipped by Ubuntu's
# http{} default; this adds JSON/JS/CSS/SVG). text/html is always included
# by nginx and must not be listed again (nginx warns on the duplicate).
# gzip_proxied any: still compress when a corporate proxy adds a Via header.
# gzip_vary on: caches key the gzipped and plain copies apart.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/css image/svg+xml;

# Hashed filenames (ManifestStaticFilesStorage, D-055): every release gets
# new URLs for changed files, so a URL's content never changes and can be
# cached forever. This is what stops new HTML from meeting a browser's
# cached old CSS/JS after a deploy (13-AUDIT §1).
location /clima-espacial/static/ {
    alias /var/www/clima-espacial/static/;
    expires max;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# serie.json sets its own `Cache-Control: public, max-age=60` (D-057), so
# it gets a location without the HTML locations' "no-cache" below — two
# conflicting Cache-Control headers would otherwise reach the browser.
# Regex location: proxy_pass can't carry a URI here, so the prefix is
# stripped with a rewrite instead, to the same unprefixed path the general
# location below forwards.
location ~ ^/clima-espacial/((?:en/)?productos/[^/]+/serie\.json)$ {
    rewrite ^/clima-espacial/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 60s;
}

# Admin (D-051/P5): never left open to the internet. nginx matches this more
# specific prefix over the general /clima-espacial/ location below
# regardless of file order, but it's placed first for readability. Add your
# home/office ranges here if you need access outside the USACH network —
# until then, use an SSH tunnel: `ssh -L 8000:localhost:8100 helio` then
# browse http://localhost:8000/gestion/ (bypasses nginx/this restriction
# entirely, so it works from anywhere once you have SSH access).
location /clima-espacial/gestion/ {
    allow 158.170.0.0/16;   # USACH network
    deny all;

    proxy_pass http://127.0.0.1:8100/gestion/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 60s;
}

location /clima-espacial/ {
    # The trailing "/" strips the "/clima-espacial" prefix before forwarding
    # (nginx replaces the matched location prefix with proxy_pass's own
    # path): Django's urlpatterns are written without the prefix and
    # FORCE_SCRIPT_NAME=/clima-espacial adds it back only for *generated*
    # URLs (reverse()/static). Drop the slash here and every internal link
    # silently 404s.
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 60s;
    # HTML is always revalidated, so a visitor gets the new page (and with
    # it the new hashed asset URLs) right after a deploy (D-055).
    add_header Cache-Control "no-cache";
}
