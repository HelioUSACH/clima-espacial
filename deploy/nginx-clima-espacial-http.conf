# Clima Espacial USACH: nginx http{}-context directives (D-100).
# Install as /etc/nginx/conf.d/clima-espacial-http.conf (Ubuntu's nginx.conf
# includes conf.d/*.conf inside http{}). These directives are only valid in
# http{}, so they can't live in deploy/nginx-clima-espacial.conf, which is
# `include`d inside the existing server{} block (D-051).
#
# Used by the flare-nrt image locations in that snippet: flare-nrt's images
# (AIA channels, Grad-CAM, the loop's and the replays' frames) are served by
# nginx straight from the service on 127.0.0.1:5050 and cached here; they
# never pass through Django.
#
# Cache directory: create it once, owned by nginx's worker user:
#   sudo install -d -o www-data -g www-data -m 750 /var/cache/nginx/clima-espacial-flare
# 8 MB of keys (about 64 000 entries) is far more than needed. Size (v0.6.1,
# D-103): the 6-h loop's frames (171 and its difference, ~58 kB each, 30
# slots/h) add ~84 MB a day while anyone plays it, kept 7 days unrequested:
# ~0.6 GB; replays ~5 MB each, a few dozen a month: <= 0.3 GB; stills
# (1024 px WebP ~0.2 MB, 512 px less): < 0.1 GB. ~1 GB in all, so 1g
# (was 512m); past that nginx drops the least recently used first.
proxy_cache_path /var/cache/nginx/clima-espacial-flare levels=1:2 keys_zone=swx_flare:8m
                 max_size=1g inactive=7d use_temp_path=off;

# Rate limits, per address (D-100, raised in v0.6.1, D-103). Many visitors
# share one address (a campus NAT), so these are per-building, not
# per-person, numbers.
# Stills (img/, gradcam/): the home page loads 1 + 3 lazy thumbnails, the
# flare page 3 (large image, Grad-CAM and its 131 Å) plus one per button
# pressed. 30 r/s with a burst of 100: a class of ~30 opening the page in
# the same second, and a person clicking through every channel.
limit_req_zone $binary_remote_addr zone=swx_flare_img:10m rate=30r/s;
# Frames (render/, replay/): immutable files, cached; one player asks for
# ~130-180 (6-h loop) or ~110 (replay: 55 slots x image + heat map) within
# seconds, 4 at a time. 100 r/s with a burst of 400: two players behind one
# address starting together both get every frame at once (measured against
# a stub: at 50 r/s / burst 200 the second of two back-to-back loops got 429
# on 126 of 177 frames), and a class of 30 pressing play drains in under a
# minute. Generous on purpose: every frame is a file that never changes and
# is answered from nginx's cache after its first request, and there are at
# most ~8 600 of them (4 days x 720 slots x 3 channels), so even a script
# pulling all of them costs the model service one file read each.
limit_req_zone $binary_remote_addr zone=swx_flare_frames:10m rate=100r/s;

# Only these query arguments reach the service, and only well-formed ones.
# kind: img (default) or diff; anything else is refused (400).
map $arg_kind $swx_flare_kind {
    ""      img;
    img     img;
    diff    diff;
    default "";
}
# slot: an ISO 8601 UTC time, YYYY-MM-DDTHH:MM(:SS)?Z (the colons may arrive
# encoded as %3A); "" when absent. $swx_flare_slot_ok: none / ok / bad.
map $arg_slot $swx_flare_slot_ok {
    ""                                                                    none;
    "~^\d{4}-\d{2}-\d{2}T\d{2}(:|%3[Aa])\d{2}((:|%3[Aa])\d{2})?Z$"        ok;
    default                                                               bad;
}
# format (v0.6.1, D-103): png (default) or webp.
map $arg_format $swx_flare_format {
    ""      png;
    png     png;
    webp    webp;
    default "";
}
# size: 512 (default) or 1024; 1024 only with kind=img (the service makes
# no 1024 px difference), checked with $swx_flare_size_ok.
map $arg_size $swx_flare_size {
    ""      512;
    512     512;
    1024    1024;
    default "";
}
map "$swx_flare_kind:$swx_flare_size" $swx_flare_size_ok {
    "diff:1024" 0;
    default     1;
}
# Grad-CAM style: overlay (default, over 131 Å) or heat (the map alone).
map $arg_style $swx_flare_style {
    ""       overlay;
    overlay  overlay;
    heat     heat;
    default  "";
}
